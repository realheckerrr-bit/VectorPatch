name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: true
        default: 'vectorpatch'
      store_password:
        description: 'Store password (min 6 chars)'
        required: true
      key_password:
        description: 'Key password (min 6 chars)'
        required: true

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate 4096-bit RSA keystore
        run: |
          keytool -genkey -v \
            -keystore vectorpatch.jks \
            -alias ${{ github.event.inputs.key_alias }} \
            -keyalg RSA -keysize 4096 \
            -validity 9125 \
            -storepass ${{ github.event.inputs.store_password }} \
            -keypass ${{ github.event.inputs.key_password }} \
            -dname "CN=VectorPatch,OU=Dev,O=VectorPatch,L=Unknown,S=Unknown,C=US"

      - name: Print base64 (masked)
        run: |
          ENCODED=$(base64 -w 0 vectorpatch.jks)
          echo "::add-mask::$ENCODED"
          echo "Add KEYSTORE_BASE64 secret with the value from the artifact"
          echo "KEY_ALIAS = ${{ github.event.inputs.key_alias }}"
          echo "STORE_PASSWORD and KEY_PASSWORD = as entered"

      - name: Upload keystore artifact (1-day)
        uses: actions/upload-artifact@v4
        with:
          name: vectorpatch-keystore
          path: vectorpatch.jks
          retention-days: 1
