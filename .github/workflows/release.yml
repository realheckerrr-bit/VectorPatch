name: Build & Release VectorPatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Extract version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION_NAME="${{ github.event.inputs.version }}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          INPUT_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          INPUT_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
            echo "KEYSTORE_PASSWORD=$INPUT_STORE_PASS" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$INPUT_STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$INPUT_KEY_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$INPUT_KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "No secret keystore provided — generating build keystore..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias vectorpatch \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=VectorPatch,O=Dev,C=US"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=vectorpatch" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=release.jks" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}

      - name: Remove keystore
        if: always()
        run: rm -f app/release.jks

      - name: Rename APK
        run: |
          find app/build/outputs/apk/release/ -maxdepth 1 -name "*.apk" -exec mv {} app/build/outputs/apk/release/VectorPatch-${{ env.VERSION_NAME }}.apk \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorPatch-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/VectorPatch-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: VectorPatch v${{ env.VERSION_NAME }}
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/VectorPatch-*.apk
          generate_release_notes: true
          body: |
            ## VectorPatch v${{ env.VERSION_NAME }}

            A modern non-root Xposed framework combining LSPatch + Vector.

            ### Requirements
            - Android 9.0+ (API 28+)
            - Shizuku (recommended, for silent installs without root)
            - Or Magisk/KernelSU + Zygisk (optional rooted path)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
